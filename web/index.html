<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="geoportal_predios">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>geoportal_predios</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (async () => {
      const migrationKey = 'geoportal-clear-old-worker-v1';
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller ||
          sessionStorage.getItem(migrationKey)) {
        return;
      }

      sessionStorage.setItem(migrationKey, 'done');
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }
      } finally {
        window.location.replace(`${window.location.pathname}?refresh=web-cache-v3${window.location.hash}`);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=web-cache-v3" async></script>
</body>
</html>
